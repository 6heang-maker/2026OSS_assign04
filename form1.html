<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Order Form</title>
</head>

<body>

<h1>Order Form</h1>
<p>주문 정보를 입력해주세요.</p>

<form action="#" method="get">

    <fieldset>
        <legend>기본 정보</legend>

        <p>
            <label for="name">이름</label><br>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="email">이메일</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="phone">전화번호</label><br>
            <input type="text" id="phone" name="phone">
        </p>

        <p>
            <label for="address">주소</label><br>
            <input type="text" id="address" name="address">
        </p>

        <p>
            <label for="city">지역</label><br>

            <select id="city" name="city">
                <option>서울</option>
                <option>부산</option>
                <option>대구</option>
                <option>포항</option>
            </select>
        </p>

        <p>
            <label for="date">배송 날짜</label><br>
            <input type="date" id="date" name="date">
        </p>
    </fieldset>


    <fieldset>
        <legend>주문 정보</legend>

        <p>결제 방법</p>

        <input type="radio" id="card" name="payment" value="card">
        <label for="card">카드</label>

        <input type="radio" id="bank" name="payment" value="bank">
        <label for="bank">계좌이체</label>


        <p>추가 옵션</p>

        <input type="checkbox" id="gift" name="gift">
        <label for="gift">선물 포장</label>

        <input type="checkbox" id="fast" name="fast">
        <label for="fast">빠른 배송</label>


        <p>
            <label for="color">색상</label><br>
            <input type="color" id="color" name="color">
        </p>


        <p>
            <label for="memo">요청사항</label><br>

            <textarea id="memo"
                      name="memo"
                      rows="5"
                      cols="40"></textarea>
        </p>
    </fieldset>

    <br>

    <button type="submit">주문하기</button>
    <button type="reset">다시 작성</button>

</form>

<br>
<a href="index.html">Home</a>

</body>
</html>
