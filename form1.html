<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Practice</title>
</head>

<body>

    <h1>Order Form</h1>

    <p>주문 정보를 입력해주세요.</p>


    <form action="#" method="get">

        <fieldset>

            <legend>기본 정보</legend>


            <p>
                <label for="name">이름</label><br>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="이름 입력"
                       required>
            </p>


            <p>
                <label for="email">이메일</label><br>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="example@gmail.com"
                       required>
            </p>


            <p>
                <label for="phone">전화번호</label><br>

                <input type="text"
                       id="phone"
                       name="phone"
                       placeholder="010-0000-0000"
                       required>
            </p>


            <p>
                <label for="address">주소</label><br>

                <input type="text"
                       id="address"
                       name="address"
                       placeholder="주소 입력"
                       required>
            </p>


            <p>
                <label for="city">지역</label><br>

                <select id="city"
                        name="city"
                        required>

                    <option value="">지역 선택</option>
                    <option value="seoul">서울</option>
                    <option value="busan">부산</option>
                    <option value="pohang">포항</option>
                    <option value="daegu">대구</option>

                </select>
            </p>


            <p>
                <label for="date">배송 날짜</label><br>

                <input type="date"
                       id="date"
                       name="date"
                       required>
            </p>

        </fieldset>


        <br>


        <fieldset>

            <legend>주문 정보</legend>


            <p>
                결제 방법
            </p>

            <input type="radio"
                   id="card"
                   name="payment"
                   value="card"
                   required>

            <label for="card">카드</label>


            <input type="radio"
                   id="bank"
                   name="payment"
                   value="bank">

            <label for="bank">계좌이체</label>


            <p>
                추가 옵션
            </p>

            <input type="checkbox"
                   id="gift"
                   name="option"
                   value="gift">

            <label for="gift">선물 포장</label>


            <input type="checkbox"
                   id="fast"
                   name="option"
                   value="fast">

            <label for="fast">빠른 배송</label>


            <p>
                <label for="color">원하는 색상</label><br>

                <input type="color"
                       id="color"
                       name="color">
            </p>


            <p>
                <label for="time">연락 가능한 시간</label><br>

                <input list="timeList"
                       id="time"
                       name="time">

                <datalist id="timeList">

                    <option value="오전">
                    <option value="오후">
                    <option value="저녁">

                </datalist>
            </p>


            <p>
                <label for="coupon">쿠폰 코드</label><br>

                <input type="text"
                       id="coupon"
                       name="coupon"
                       placeholder="쿠폰 코드">
            </p>


            <p>
                <label for="memo">요청사항</label><br>

                <textarea id="memo"
                          name="memo"
                          rows="5"
                          cols="40"
                          placeholder="요청사항을 입력해주세요"></textarea>
            </p>

        </fieldset>


        <br>


        <button type="submit">
            주문하기
        </button>

        <button type="reset">
            다시 작성
        </button>

    </form>


    <hr>


    <p>
        Clone Coding Reference
    </p>

    <p>
        https://getbootstrap.com/docs/5.2/examples/checkout/
    </p>


    <p>
        <a href="index.html">Home</a>
    </p>

</body>

</html>
